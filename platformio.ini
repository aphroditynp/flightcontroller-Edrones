; PlatformIO Project Configuration File
;
;   Build options: build flags, source filterkan di
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 1152000
; USB_MTPDISK_SERIAL exposes ONE USB CDC port (Serial, dedicated to the
; binary MAVLink GCS link, fc::Mavlink) plus an MTP (Media Transfer
; Protocol) disk endpoint that lets a host file manager browse the Teensy
; 4.1's built-in microSD card directly over the same USB cable -- no card
; removal needed. See docs/sd-logger-mtp.md.
;
; Was USB_DUAL_SERIAL (Serial + SerialUSB1) through 2026-08-19: Teensy 4.1
; has no "Dual Serial + MTP" USB combination (checked directly against
; teensy41's boards.txt menu.usb entries), so gaining MTP meant giving up
; SerialUSB1 -- which fc::DataLogger used for a live barometer-only CSV
; stream. That data now goes into fc::SdLogger's CSV file on the SD card
; instead (plus attitude/mode/arm/RC channels DataLogger never logged) --
; see main.cpp's taskSdLog. fc::DataLogger itself is left in the tree,
; unused by main.cpp, for a future bench build that reverts to Dual Serial.
;
; This platform-teensy version only recognizes the USB mode via a
; CPPDEFINE (checked directly in builder/frameworks/arduino.py), not the
; newer board_build.usb_type ini key.
build_flags = -D USB_MTPDISK_SERIAL
lib_deps =
	bolderflight/Bolder Flight Systems SBUS@^8.1.4
	zerokol/eFLL@^1.4.1
	duracopter/MAVLink v2 C library@^2.0
	; Not published to the PlatformIO registry under this name; PlatformIO
	; supports git-URL lib_deps, so it's fetched/pinned here instead of
	; being hand-vendored (unlike lib/third_party/libcanard, which isn't
	; an Arduino/PlatformIO-packaged library at all).
	https://github.com/tonton81/FlexCAN_T4.git#b928bcb2f74fdf0ccb76660f52ca1a2819ff4e2c
	; MTP responder (SD card browsable over USB, see build_flags comment
	; above). Not in Teensyduino core, pinned to a commit the same way as
	; FlexCAN_T4 above.
	https://github.com/KurtE/MTP_Teensy.git#13ae26f39f6d9f3b690950dfb96ed0f79ee436d1
; PlatformIO's library dependency finder pulls in framework-arduinoteensy's
; bundled USBHost_t36 (USB HOST support -- unrelated to this project, which
; only uses Teensy's USB DEVICE side) even though nothing in this project or
; MTP_Teensy's own sources (checked directly) #includes it. USBHost_t36's own
; bluetooth.cpp fails to compile standalone (missing EEPROM.h on this LDF
; path) -- excluded since we never use USB host functionality anyway.
lib_ignore = USBHost_t36
